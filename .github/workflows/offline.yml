name: Offline package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      MEMORY_CORE_DEMO_OPENAI_API_KEY: ""
      MEMORY_CORE_DEMO_OPENAI_EMBEDDING_API_KEY: ""
      OPENCLAW_ORACLE_REPO: ""
      MEMORY_CORE_LIVE_OPENAI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.18"
      - name: Isolate test state
        shell: bash
        run: |
          scratch="$(mktemp -d "${RUNNER_TEMP}/memory-core-tests.XXXXXX")"
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - name: Install frozen development stack
        run: uv sync --frozen
      - name: Lint and validate project name
        run: |
          uv run --frozen ruff check . --no-cache
          uv run --frozen python scripts/rename_project.py --check
      - name: Run offline tests
        run: uv run --frozen pytest -q -p no:cacheprovider
      - name: Check clean wheel and sdist consumers
        run: uv run --frozen python scripts/check_distribution.py
