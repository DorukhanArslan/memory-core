name: Memory equivalence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    name: Differential subset (full contract on manual runs)
    runs-on: ubuntu-latest
    # The registered catalog took 38 minutes locally; manual runs execute it twice.
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      MEMORY_CORE_LIVE_OPENAI: ""
      MEMORY_CORE_DEMO_OPENAI_API_KEY: ""
      MEMORY_CORE_DEMO_OPENAI_EMBEDDING_API_KEY: ""
      OPENCLAW_ORACLE_REPO: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the exact reference source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openclaw/openclaw
          ref: bcfc88812a35243893585dbeca87ca41b48272ca
          path: .reference/openclaw
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.16.0"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.18"
      - name: Install frozen development stack
        run: uv sync --frozen
      - name: Test the new acceptance harness
        run: MEMORY_EQ_NODE="$(command -v node)" uv run --frozen pytest -q tests/equivalence
      - name: Verify the fixed source inventory
        run: uv run --frozen python -m equivalence.source_map --reference .reference/openclaw
      - name: Prepare authenticated native source dependencies
        run: >-
          uv run --frozen python -m equivalence.dependencies
          --reference .reference/openclaw --destination .reference/npm --install
      - name: Prepare the authenticated official memory manager runtime
        run: >-
          uv run --frozen python -m equivalence.release_runtime
          --reference .reference/openclaw --destination .reference/release-runtime --install
      - name: Compare the registered cases with actual OpenClaw
        run: >-
          uv run --frozen python scripts/check_equivalence.py
          --reference .reference/openclaw --node "$(command -v node)"
          --release-runtime .reference/release-runtime
          --smoke --report .equivalence-results/subset.json
      - name: Compare the zero-credit cold retry development packet
        if: always()
        run: >-
          uv run --frozen python scripts/check_query_sync_cold_retry.py
          --reference .reference/openclaw --node "$(command -v node)"
          --release-runtime .reference/release-runtime
          --output .equivalence-results/query-sync-cold-retry
      - name: Require the complete contract on manual acceptance runs
        if: always() && github.event_name == 'workflow_dispatch'
        run: >-
          uv run --frozen python scripts/check_equivalence.py
          --reference .reference/openclaw --node "$(command -v node)"
          --release-runtime .reference/release-runtime
          --report .equivalence-results/full.json
      - name: Replay the retained original update captures through their guard tests
        # The earlier test step runs before any original capture exists, so it skips these.
        if: always()
        run: uv run --frozen pytest -q tests/equivalence/test_host_update_isolation_evidence.py
      - name: Replay the retained original turn-barrier boundary captures
        if: always()
        run: MEMORY_EQ_NODE="$(command -v node)" uv run --frozen pytest -q tests/equivalence/test_host_turn_barrier_boundaries_evidence.py
      - name: Replay both retained index identity boundary engines
        if: always()
        run: uv run --frozen pytest -q tests/equivalence/test_index_identity_boundaries_evidence.py
      - name: Replay both retained query-sync outcome engines
        if: always()
        run: MEMORY_EQ_NODE="$(command -v node)" uv run --frozen pytest -q tests/equivalence/test_query_sync_outcomes_evidence.py
      - name: Replay the zero-credit cold retry development captures
        if: always()
        run: >-
          MEMORY_EQ_NODE="$(command -v node)"
          MEMORY_QUERY_SYNC_COLD_RETRY_CAPTURE_ROOT=.equivalence-results/query-sync-cold-retry
          uv run --frozen pytest -q tests/equivalence/test_query_sync_cold_retry_evidence.py
      - name: Retain results, including failed acceptance runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-equivalence-results
          # The small per-attempt files hold a rejected original host's own streams and capture.
          path: |
            .equivalence-results/*.json
            .equivalence-results/host-update-isolation/*/case/stdout.json
            .equivalence-results/host-update-isolation/*/case/stderr.log
            .equivalence-results/host-update-isolation/*/case/evidence/native-raw.json
            .equivalence-results/host-turn-barrier-boundaries/*/case/stdout.json
            .equivalence-results/host-turn-barrier-boundaries/*/case/stderr.log
            .equivalence-results/host-turn-barrier-boundaries/*/case/context.json
            .equivalence-results/host-turn-barrier-boundaries/*/case/evidence/native-raw.json
            .equivalence-results/host-turn-barrier-boundaries/*/case/evidence/fixture-source-captures/*.mjs
            .equivalence-results/host-turn-barrier-boundaries/*/case/traces/*.jsonl
            .equivalence-results/index-identity-boundaries/*/case/stdout.json
            .equivalence-results/index-identity-boundaries/*/case/stderr.log
            .equivalence-results/index-identity-boundaries/*/case/context.json
            .equivalence-results/index-identity-boundaries/*/case/evidence/native-raw.json
            .equivalence-results/index-identity-boundaries/*/case/traces/*.jsonl
            .equivalence-results/index-identity-boundaries/sdk-attempt-*/python-raw.json
            .equivalence-results/index-identity-boundaries/sdk-attempt-*/sdk-identity-boundary-*/sdk-host-raw.json
            .equivalence-results/index-identity-boundaries/sdk-attempt-*/sdk-identity-boundary-*/tool-*-envelope.json
            .equivalence-results/query-sync-outcomes/*/case/stdout.json
            .equivalence-results/query-sync-outcomes/*/case/stderr.log
            .equivalence-results/query-sync-outcomes/*/case/context.json
            .equivalence-results/query-sync-outcomes/*/case/process.json
            .equivalence-results/query-sync-outcomes/*/case/request.json
            .equivalence-results/query-sync-outcomes/*/case/evidence/native-raw.json
            .equivalence-results/query-sync-outcomes/*/case/traces/*.jsonl
            .equivalence-results/query-sync-outcomes/sdk-attempt-*/python-raw.json
            .equivalence-results/query-sync-outcomes/sdk-attempt-*/sdk-query-sync-*/sdk-host-raw.json
            .equivalence-results/query-sync-outcomes/sdk-attempt-*/sdk-query-sync-*/tool-*-envelope.json
            .equivalence-results/query-sync-cold-retry/**
          # The reports live in a dot-directory, which this action skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore
