name: Inspect retained equivalence failure

on:
  push:
    branches: [inspect-retained-equivalence-43673106847]
    paths: [.github/workflows/inspect-retained-equivalence.yml]

permissions:
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the existing artifact without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'DorukhanArslan/memory-core'
          gh api --method GET repos/DorukhanArslan/memory-core/actions/artifacts/14146819533 > "$RUNNER_TEMP/retained-artifact-metadata.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / 'retained-artifact-metadata.json').read_text())
          assert metadata['id'] == 14146819533 and not metadata['expired']
          assert metadata['workflow_run']['id'] == 43673106847
          assert metadata['workflow_run']['head_sha'] == '5b729e9e9b6c344b28dc94675e4dc8dc06fff083'
          assert metadata['size_in_bytes'] == 1740219107
          assert metadata['digest'] == 'sha256:5d35a943b74dd0db2d061c17c5c0230be4303f53b7589dfc90197a693dacf050'
          print('Pinned existing artifact metadata verified; no tests are executed.')
          PY
          gh api --method GET repos/DorukhanArslan/memory-core/actions/artifacts/14146819533/zip > "$RUNNER_TEMP/retained-equivalence.zip"
      - name: Read the original failure from the retained ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ['RUNNER_TEMP']) / 'retained-equivalence.zip'
          with archive.open('rb') as stream:
              archive_sha = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert archive_sha == '5d35a943b74dd0db2d061c17c5c0230be4303f53b7589dfc90197a693dacf050'

          with zipfile.ZipFile(archive) as retained:
              members = retained.infolist()

              def unique_member(suffix):
                  selected = [item for item in members
                              if item.filename == suffix or item.filename.endswith('/' + suffix)]
                  if len(selected) != 1:
                      raise ValueError(f'Expected one member for {suffix!r}; found {len(selected)}')
                  return selected[0]

              report_member = unique_member('.equivalence-results/full.json')
              print(json.dumps({'reportMember': report_member.filename,
                                'reportBytes': report_member.file_size}))
              # This producer appends these failure fields and three terminal fields.
              # Read their authenticated suffix, preserving Python/JS surrogate escapes.
              # This is diagnostic extraction, not a full acceptance validation.
              report_hash = hashlib.sha256()
              tail = b''
              with retained.open(report_member) as stream:
                  while block := stream.read(1024 * 1024):
                      report_hash.update(block)
                      tail = (tail + block)[-8 * 1024 * 1024:]
              report_sha = report_hash.hexdigest()
              assert report_sha == '34213268069115e5b65cbd95b62ad687049f7dc2880ca37446da7687d0929ec5'
              marker = b',"failedReferenceCaseId":'
              assert tail.count(marker) == 1, 'Failure suffix is missing or ambiguous'
              suffix = b'{' + tail[tail.index(marker) + 1:]
              report = json.loads(suffix)
              assert list(report) == ['failedReferenceCaseId', 'rejectedRuntimeEvidence',
                                      'durationSeconds', 'finishedAt', 'fullScopePassed']
              assert report['fullScopePassed'] is False
              assert len(report['rejectedRuntimeEvidence']) == 1
              assert report['rejectedRuntimeEvidence'][0]['caseIds'] == [report['failedReferenceCaseId']]
              selected = {'sourceRun': 43673106847, 'sourceArtifact': 14146819533,
                          'archiveSha256': archive_sha, 'reportSha256': report_sha,
                          'extraction': 'Authenticated terminal failure fields; no acceptance validation or score',
                          'failedReferenceCaseId': report.get('failedReferenceCaseId'),
                          'rejectedRuntimeEvidence': report.get('rejectedRuntimeEvidence'),
                          'retainedFailureDetails': [], 'testsExecuted': False}

              for rejected in report.get('rejectedRuntimeEvidence', []):
                  directory = PurePosixPath(rejected['retainedDirectory'])
                  parts = directory.parts
                  anchor = parts.index('.equivalence-results')
                  suffix = '/'.join(parts[anchor:])
                  detail = {'caseIds': rejected.get('caseIds'), 'reason': rejected.get('reason')}
                  for name, limit in [('process.json', 1024 * 1024), ('stderr.log', 64 * 1024),
                                      ('stdout.json', 4 * 1024 * 1024)]:
                      try:
                          item = unique_member(suffix + '/' + name)
                          with retained.open(item) as stream:
                              data = stream.read(limit + 1)
                          truncated = len(data) > limit
                          record = {'member': item.filename, 'bytes': item.file_size,
                                    'truncated': truncated}
                          if name == 'stderr.log':
                              record['text'] = data[:limit].decode('utf-8', errors='replace')
                          elif truncated:
                              record['note'] = 'Not parsed: exceeds the declared diagnostic bound'
                          else:
                              value = json.loads(data)
                              keys = (['returncode', 'timedOut', 'observationFailure', 'integrityError',
                                       'protectedBytesUnchanged', 'contextPath', 'requestPath', 'pid', 'parentPid']
                                      if name == 'process.json' else ['id', 'ok', 'error'])
                              record['selectedFields'] = {key: value[key] for key in keys if key in value}
                          detail[name] = record
                      except (ValueError, KeyError, UnicodeError, zipfile.BadZipFile) as error:
                          detail[name] = {'readError': str(error)}
                  selected['retainedFailureDetails'].append(detail)

                  # Retain small original records for offline reading, not capture replay.
                  prefix = unique_member(suffix + '/process.json').filename[:-len('process.json')]
                  entries = [item for item in members
                             if item.filename.startswith(prefix) and not item.is_dir()]
                  inventory = [{'path': item.filename[len(prefix):], 'bytes': item.file_size,
                                'crc32': item.CRC} for item in entries]
                  selected['caseFileInventory'] = inventory
                  selected['progressRecords'] = []

                  def brief(value, depth=0):
                      if depth > 6:
                          return '<display depth bound>'
                      if isinstance(value, dict):
                          return {key: brief(part, depth + 1) for key, part in value.items()
                                  if key not in {'v8Hex', 'privateReturn', 'result', 'dataBase64'}}
                      if isinstance(value, list):
                          return [brief(part, depth + 1) for part in value[:80]]
                      if isinstance(value, str) and len(value) > 1024:
                          return value[:1024] + '<display truncated>'
                      return value

                  def priority(item):
                      relative = item.filename[len(prefix):]
                      if relative.startswith('gates/'):
                          return 0, relative
                      if relative in {'evidence/native-raw.json', 'evidence/foreground-1-raw.json',
                                      'evidence/forgetter-1-raw.json'}:
                          return 1, relative
                      return (2 if relative.endswith('.json') else 3), relative

                  bundle_path = Path(os.environ['RUNNER_TEMP']) / 'failed-case-progress.zip'
                  copied, skipped, used = [], [], 0
                  with zipfile.ZipFile(bundle_path, 'w', compression=zipfile.ZIP_DEFLATED) as bundle:
                      for item in sorted(entries, key=priority):
                          relative = item.filename[len(prefix):]
                          include = (relative.startswith('gates/') or relative.endswith(('.json', '.jsonl')))
                          limit = 8 * 1024 * 1024 if relative.endswith('.json') else 2 * 1024 * 1024
                          if not include or item.file_size > limit or used + item.file_size > 24 * 1024 * 1024:
                              skipped.append({'path': relative, 'bytes': item.file_size})
                              continue
                          assert not PurePosixPath(relative).is_absolute() and '..' not in PurePosixPath(relative).parts
                          data = retained.read(item)
                          bundle.writestr(relative, data)
                          used += len(data)
                          copied.append({'path': relative, 'bytes': len(data),
                                         'sha256': hashlib.sha256(data).hexdigest()})
                          if relative.startswith('gates/'):
                              try:
                                  value = json.loads(data)
                              except ValueError:
                                  value = {'text': data[:2048].decode(errors='replace')}
                              selected['progressRecords'].append({'path': relative, 'gate': brief(value)})
                          elif relative.startswith('evidence/') and relative.endswith('-raw.json'):
                              try:
                                  value = json.loads(data)
                              except ValueError as error:
                                  selected['progressRecords'].append({'path': relative,
                                      'parseError': str(error), 'originalBytesRetainedInBundle': True})
                                  continue
                              if isinstance(value, list) and len(value) == 1:
                                  value = value[0]
                              if not isinstance(value, dict):
                                  selected['progressRecords'].append({'path': relative,
                                      'jsonType': type(value).__name__, 'originalBytesRetainedInBundle': True})
                                  continue
                              keys = ['actor', 'instance', 'steps', 'gates', 'children', 'calls', 'completed',
                                      'allChildrenReaped', 'failure', 'controlFailures', 'teardownFailures']
                              selected['progressRecords'].append({'path': relative,
                                  'selectedFields': brief({key: value[key] for key in keys if key in value})})
                      index = {'sourceArtifact': 14146819533, 'sourceArchiveSha256': archive_sha,
                               'sourceReportSha256': report_sha, 'retainedDirectory': str(directory),
                               'copiedOriginalBytes': copied, 'skipped': skipped,
                               'inventory': inventory, 'diagnosticOnlyNotCaptureRestoration': True,
                               'displayBounds': {'maxDepth': 6, 'maxListItems': 80, 'maxString': 1024}}
                      bundle.writestr('progress-index.json', json.dumps(index, ensure_ascii=True, indent=2))
                  selected['smallBundle'] = {'bytes': bundle_path.stat().st_size,
                      'sha256': hashlib.sha256(bundle_path.read_bytes()).hexdigest(),
                      'originalLogicalBytesCopied': used, 'copiedFiles': len(copied),
                      'skippedFiles': len(skipped)}

                  # This single complete channel fits the transfer bound when retained alone.
                  gate = json.loads(retained.read(unique_member(suffix + '/gates/keywordReply.hit.json')))
                  assert gate['actor'] == 'foreground' and gate['threadId'] == 0
                  event_name = 'evidence/' + str(gate['pid']) + '-0-events.jsonl'
                  event_member = unique_member(suffix + '/' + event_name)
                  assert event_member.file_size <= 30 * 1024 * 1024
                  event_bytes = retained.read(event_member)
                  actor = json.loads(retained.read(unique_member(suffix + '/evidence/foreground-1-raw.json')))
                  channel = next(row for row in actor['passiveChannels']
                                 if row['pid'] == gate['pid'] and row['threadId'] == 0)
                  assert channel['publishedBytes'] == channel['persistedBytes']
                  assert hashlib.sha256(event_bytes[:channel['persistedBytes']]).hexdigest() == channel['sha256']
                  event_index = {'sourceArtifact': 14146819533, 'sourceArchiveSha256': archive_sha,
                      'sourceReportSha256': report_sha, 'path': event_name, 'bytes': len(event_bytes),
                      'sha256': hashlib.sha256(event_bytes).hexdigest(), 'committedPrefix': channel,
                      'diagnosticOnlyNotCaptureRestoration': True}
                  event_bundle = Path(os.environ['RUNNER_TEMP']) / 'foreground-watch-events.zip'
                  with zipfile.ZipFile(event_bundle, 'w', compression=zipfile.ZIP_DEFLATED) as bundle:
                      bundle.writestr(event_name, event_bytes)
                      bundle.writestr('watch-events-index.json', json.dumps(event_index, ensure_ascii=True, indent=2))
                  selected['watchEventsBundle'] = {'bytes': event_bundle.stat().st_size,
                      'sha256': hashlib.sha256(event_bundle.read_bytes()).hexdigest(), 'source': event_index}

          output = json.dumps(selected, ensure_ascii=True, indent=2)
          (Path(os.environ['RUNNER_TEMP']) / 'selected-retained-failure.json').write_text(output + '\n')
          print('RETAINED_FAILURE_JSON_BEGIN')
          print(output)
          print('RETAINED_FAILURE_JSON_END')
          PY
      - name: Retain the small original progress records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-case-progress-43673106847
          path: ${{ runner.temp }}/failed-case-progress.zip
          retention-days: 7
          if-no-files-found: error
      - name: Retain the complete foreground watch channel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foreground-watch-events-43673106847
          path: ${{ runner.temp }}/foreground-watch-events.zip
          retention-days: 7
          if-no-files-found: error
