[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memory-core"
dynamic = ["version"]
description = "memory-core: memory for LLM agents, an unofficial Python port of OpenClaw memory-core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
demo = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
]
# The stack memory_core.adapters.langgraph is tested against (it imports none of it) and
# examples/langgraph_agent.py imports; the host adds its chat model provider.
langgraph = [
  "langgraph>=1.2",
  "langchain-core>=1.6",
]

[dependency-groups]
dev = [
  "memory-core[demo]",
  "memory-core[langgraph]",
  "langchain-openai>=1.6",
  "pytest>=8.3",
  "ruff>=0.6",
]

# The project name: [project] name above, and the display name prose and the UI write.
# Rename the project with scripts/rename_project.py, never by hand.
[tool.memory_core]
display-name = "memory-core"

[tool.hatch.version]
path = "memory_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["memory_core"]

[tool.hatch.build.targets.sdist]
only-include = ["memory_core", "README.md", "CHANGELOG.md", "LICENSE.openclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
