<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenClaw Chat Memory Lab</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-title">
          <h1>OpenClaw Chat Memory Lab</h1>
          <p>Inspect recall, assistant context, memory flush, file diff, and reindex behavior turn by turn.</p>
        </div>
        <div class="toolbar" aria-label="Engine and memory controls">
          <label>
            API key
            <input id="api-key" type="password" autocomplete="off" placeholder="sk-..." aria-label="OpenAI API key">
          </label>
          <label>
            Base URL
            <input id="base-url" value="https://api.openai.com/v1" aria-label="OpenAI-compatible base URL">
          </label>
          <label>
            Model
            <input id="model" value="gpt-5.2" aria-label="OpenAI-compatible model">
          </label>
          <span id="engine-status" class="engine-status" aria-live="polite">Engine status loading</span>
          <label class="toggle">
            <input id="auto-flush" type="checkbox" checked>
            Auto flush
          </label>
          <button id="manual-flush" type="button">Manual flush</button>
          <button id="reset" type="button">Reset</button>
          <button id="seed" type="button">Seed</button>
          <button id="reindex" type="button">Reindex</button>
        </div>
      </header>

      <section class="workspace" aria-label="Chat memory workspace">
        <section class="chat-panel" aria-label="Chat">
          <div id="chat-log" class="chat-log" aria-live="polite"></div>
          <form id="chat-form" class="composer">
            <textarea id="chat-input" rows="3" placeholder="Type a chat turn to observe memory recall and flush behavior." aria-label="Chat message"></textarea>
            <button type="submit">Send</button>
          </form>
        </section>

        <aside id="memory-pipeline" class="pipeline" aria-label="Memory pipeline">
          <div class="panel-heading">
            <h2>Memory Pipeline</h2>
            <span id="turn-count">0 turns</span>
          </div>
          <div id="pipeline-content" class="pipeline-content"></div>
        </aside>
      </section>

      <nav class="tabs" aria-label="Demo tabs">
        <button class="tab active" data-tab="memory-files" type="button">Memory Files</button>
        <button class="tab" data-tab="tool-inspector" type="button">Tool Inspector</button>
        <button class="tab" data-tab="config" type="button">Config</button>
      </nav>

      <section id="memory-files" class="tab-panel active" aria-label="Memory files"></section>

      <section id="tool-inspector" class="tab-panel" aria-label="Tool Inspector">
        <div class="panel-heading">
          <h2>Tool Inspector</h2>
          <span>Existing endpoints</span>
        </div>
        <div class="inspector-grid">
          <form id="search-form" class="tool-form">
            <h3>memory_search</h3>
            <label>
              Query
              <input name="query" value="lemon pepper" aria-label="query">
            </label>
            <label>
              Max results
              <input name="maxResults" value="5" inputmode="numeric" aria-label="max results">
            </label>
            <label>
              Min score
              <input name="minScore" value="0" inputmode="decimal" aria-label="min score">
            </label>
            <button type="submit">Search</button>
          </form>
          <form id="get-form" class="tool-form">
            <h3>memory_get</h3>
            <label>
              Path
              <input name="path" value="MEMORY.md" aria-label="path">
            </label>
            <label>
              From line
              <input name="from" value="1" inputmode="numeric" aria-label="from line">
            </label>
            <label>
              Line count
              <input name="lines" value="20" inputmode="numeric" aria-label="line count">
            </label>
            <button type="submit">Get</button>
          </form>
          <form id="prompt-form" class="tool-form">
            <h3>prompt_preview</h3>
            <label>
              Tools
              <input name="tools" value="memory_search,memory_get" aria-label="tools">
            </label>
            <label>
              Citations
              <select name="citationsMode" aria-label="citations mode">
                <option value="on">on</option>
                <option value="off">off</option>
              </select>
            </label>
            <button type="submit">Preview</button>
          </form>
        </div>
        <pre id="output">{}</pre>
      </section>

      <section id="config" class="tab-panel" aria-label="Config"></section>
    </main>

    <script>
      let state = {turns: [], memoryFiles: [], memoryFileContents: {}, engines: {}, config: {}};
      const DEFAULT_OPENAI = {
        baseUrl: "https://api.openai.com/v1",
        model: "gpt-5.2"
      };

      async function requestJson(url, body) {
        const options = body === undefined ? {} : {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body)
        };
        const response = await fetch(url, options);
        let payload;
        try {
          payload = await response.json();
        } catch {
          payload = {error: response.statusText || "Request failed"};
        }
        if (!response.ok) {
          throw new Error(payload.error || response.statusText || "Request failed");
        }
        return payload;
      }

      async function refresh() {
        state = await requestJson("/api/chat/state");
        render();
      }

      function render() {
        hydrateOpenAIConfig();
        renderChat();
        renderPipeline();
        renderMemoryFiles();
        renderConfig();
        renderEngineStatus();
      }

      function renderChat() {
        const log = document.querySelector("#chat-log");
        log.replaceChildren();
        if (!state.turns.length) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "Send a message to start observing memory behavior.";
          log.append(empty);
          return;
        }
        for (const [index, turn] of state.turns.entries()) {
          log.append(messageNode("user", `Turn ${index + 1}`, turn.userMessage));
          log.append(messageNode("assistant", "Assistant", turn.assistantResponse));
        }
        log.scrollTop = log.scrollHeight;
      }

      function messageNode(role, label, text) {
        const node = document.createElement("article");
        node.className = `message ${role}`;
        const meta = document.createElement("strong");
        meta.textContent = label;
        const body = document.createElement("p");
        body.textContent = text || "(empty)";
        node.append(meta, body);
        return node;
      }

      function appendStreamingAssistant(text) {
        const log = document.querySelector("#chat-log");
        let node = document.querySelector("#streaming-assistant");
        if (!node) {
          node = messageNode("assistant", "Assistant", "");
          node.id = "streaming-assistant";
          log.append(node);
        }
        node.querySelector("p").textContent += text;
        log.scrollTop = log.scrollHeight;
      }

      function renderPipeline() {
        const latest = state.turns[state.turns.length - 1];
        document.querySelector("#turn-count").textContent = `${state.turns.length} ${state.turns.length === 1 ? "turn" : "turns"}`;
        const panel = document.querySelector("#pipeline-content");
        panel.replaceChildren();
        if (!latest) {
          panel.append(stepNode("Recall", "Waiting for a chat turn."));
          panel.append(stepNode("Assistant Context", "No recalled memory yet."));
          panel.append(stepNode("Raw Flush Output", "No raw flush output yet."));
          panel.append(stepNode("Flush Decision", "No flush decision yet."));
          panel.append(stepNode("File Diff", "No file diff yet."));
          panel.append(stepNode("Reindex", "No reindex run yet."));
          return;
        }
        panel.append(stepNode("Recall", `${latest.recallQuery}\n\n${formatJson(latest.recallResults)}`));
        panel.append(stepNode("Assistant Context", (latest.memoryContext || []).join("\n") || "No recalled memory."));
        panel.append(stepNode("Raw Flush Output", latest.flush ? latest.flush.rawText || "(empty)" : "Not run for this turn."));
        panel.append(stepNode("Flush Decision", latest.flush ? formatJson(latest.flush.parsed) : "Not run for this turn."));
        panel.append(stepNode("File Diff", latest.flush ? latest.flush.diff || "No file changes." : "Not run for this turn."));
        panel.append(stepNode("Reindex", latest.flush ? reindexStatus(latest.flush) : "Not run for this turn."));
      }

      function reindexStatus(flush) {
        const summary = `${flush.indexedFiles} files, ${flush.chunks} chunks`;
        return flush.reindexError ? `${summary}\n\nError: ${flush.reindexError}` : summary;
      }

      function stepNode(title, text) {
        const node = document.createElement("section");
        node.className = "pipeline-step";
        const heading = document.createElement("h3");
        heading.textContent = title;
        const body = document.createElement("pre");
        body.textContent = text;
        node.append(heading, body);
        return node;
      }

      function renderMemoryFiles() {
        const panel = document.querySelector("#memory-files");
        panel.replaceChildren();
        const heading = document.createElement("div");
        heading.className = "panel-heading";
        heading.innerHTML = "<h2>Memory Files</h2><span>Click a file to inspect with memory_get</span>";
        panel.append(heading);
        const list = document.createElement("div");
        list.className = "file-list";
        for (const path of state.memoryFiles || []) {
          const file = document.createElement("section");
          file.className = "memory-file";
          const heading = document.createElement("div");
          heading.className = "memory-file-heading";
          const title = document.createElement("strong");
          title.textContent = path;
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Inspect";
          button.onclick = () => inspectMemoryFile(path);
          heading.append(title, button);
          const body = document.createElement("pre");
          body.textContent = (state.memoryFileContents && state.memoryFileContents[path]) || "(missing or empty)";
          file.append(heading, body);
          list.append(file);
        }
        if (!list.children.length) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "No memory files discovered.";
          list.append(empty);
        }
        panel.append(list);
      }

      function renderConfig() {
        document.querySelector("#config").innerHTML = `<div class="panel-heading"><h2>Config</h2><span>Runtime state</span></div><pre>${formatJson({
          engines: state.engines,
          config: state.config
        })}</pre>`;
      }

      function renderEngineStatus() {
        const openai = state.engines ? state.engines.openai : undefined;
        const envAvailable = openai && openai.available === true;
        const apiKey = document.querySelector("#api-key").value.trim();
        const model = document.querySelector("#model").value.trim() || DEFAULT_OPENAI.model;
        document.querySelector("#engine-status").textContent = apiKey
          ? `OpenAI-compatible ready: ${model}`
          : envAvailable
            ? `OpenAI-compatible ready from environment: ${openai.model || model}`
            : `Enter an API key to use OpenAI-compatible chat (${openai ? openai.model : DEFAULT_OPENAI.model}).`;
        const disabled = !apiKey && !envAvailable;
        document.querySelector("#chat-form button[type='submit']").disabled = disabled;
        document.querySelector("#manual-flush").disabled = disabled;
      }

      function hydrateOpenAIConfig() {
        if (hydrateOpenAIConfig.done) return;
        const baseUrl = sessionStorage.getItem("openclaw-demo-base-url");
        const model = sessionStorage.getItem("openclaw-demo-model");
        const apiKey = sessionStorage.getItem("openclaw-demo-api-key");
        if (baseUrl) document.querySelector("#base-url").value = baseUrl;
        if (model) document.querySelector("#model").value = model === "gpt-5.5" ? DEFAULT_OPENAI.model : model;
        if (apiKey) document.querySelector("#api-key").value = apiKey;
        hydrateOpenAIConfig.done = true;
      }

      function openAIConfig() {
        const config = {
          baseUrl: document.querySelector("#base-url").value.trim() || DEFAULT_OPENAI.baseUrl,
          apiKey: document.querySelector("#api-key").value.trim(),
          model: document.querySelector("#model").value.trim() || DEFAULT_OPENAI.model
        };
        sessionStorage.setItem("openclaw-demo-base-url", config.baseUrl);
        sessionStorage.setItem("openclaw-demo-model", config.model);
        if (config.apiKey) {
          sessionStorage.setItem("openclaw-demo-api-key", config.apiKey);
        }
        return config;
      }

      function formatJson(value) {
        return JSON.stringify(value, null, 2);
      }

      function showOutput(payload) {
        document.querySelector("#output").textContent = formatJson(payload);
      }

      async function postInspector(url, body) {
        try {
          const payload = await requestJson(url, body);
          showOutput(payload);
          await refresh();
        } catch (error) {
          showOutput({error: error.message});
        }
      }

      async function inspectMemoryFile(path) {
        activateTab("tool-inspector");
        document.querySelector("#get-form input[name='path']").value = path;
        await postInspector("/api/get", {path, from: 1, lines: 200});
      }

      function activateTab(id) {
        document.querySelectorAll(".tab, .tab-panel").forEach((node) => node.classList.remove("active"));
        document.querySelector(`.tab[data-tab='${id}']`).classList.add("active");
        document.querySelector(`#${id}`).classList.add("active");
      }

      document.querySelector("#chat-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = document.querySelector("#chat-input");
        try {
          await sendStreamingMessage(input.value);
          input.value = "";
        } catch (error) {
          showOutput({error: error.message});
          activateTab("tool-inspector");
        }
      });

      async function sendStreamingMessage(message) {
        const trimmed = message.trim();
        if (!trimmed) return;
        const log = document.querySelector("#chat-log");
        if (!state.turns.length) log.replaceChildren();
        log.append(messageNode("user", `Turn ${state.turns.length + 1}`, trimmed));
        const response = await fetch("/api/chat/send-stream", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            message: trimmed,
            engine: "openai",
            openai: openAIConfig(),
            autoFlush: document.querySelector("#auto-flush").checked
          })
        });
        if (!response.ok || !response.body) {
          throw new Error(response.statusText || "Streaming request failed");
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const {value, done} = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, {stream: true});
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";
          for (const part of parts) handleSseEvent(part);
        }
        if (buffer.trim()) handleSseEvent(buffer);
      }

      function handleSseEvent(block) {
        const eventLine = block.split("\n").find((line) => line.startsWith("event: "));
        const dataLine = block.split("\n").find((line) => line.startsWith("data: "));
        if (!eventLine || !dataLine) return;
        const event = eventLine.replace("event: ", "").trim();
        const data = JSON.parse(dataLine.replace("data: ", ""));
        if (event === "assistant_delta") {
          appendStreamingAssistant(data.text || "");
        } else if (event === "final_state") {
          state = data;
          render();
        } else if (event === "error") {
          throw new Error(data.error || "Streaming chat failed");
        }
      }

      document.querySelector("#manual-flush").onclick = async () => {
        try {
          state = await requestJson("/api/chat/flush", {engine: "openai", openai: openAIConfig()});
          render();
        } catch (error) {
          showOutput({error: error.message});
          activateTab("tool-inspector");
        }
      };
      document.querySelector("#reset").onclick = async () => {
        state = await requestJson("/api/chat/reset", {});
        render();
      };
      document.querySelector("#seed").onclick = async () => postInspector("/api/seed", {});
      document.querySelector("#reindex").onclick = async () => postInspector("/api/reindex", {});
      document.querySelector("#api-key").oninput = () => {
        sessionStorage.setItem("openclaw-demo-api-key", document.querySelector("#api-key").value.trim());
        renderEngineStatus();
      };
      document.querySelector("#base-url").oninput = () => sessionStorage.setItem("openclaw-demo-base-url", document.querySelector("#base-url").value.trim());
      document.querySelector("#model").oninput = () => {
        sessionStorage.setItem("openclaw-demo-model", document.querySelector("#model").value.trim());
        renderEngineStatus();
      };
      document.querySelector("#search-form").onsubmit = (event) => {
        event.preventDefault();
        postInspector("/api/search", Object.fromEntries(new FormData(event.currentTarget)));
      };
      document.querySelector("#get-form").onsubmit = (event) => {
        event.preventDefault();
        const raw = Object.fromEntries(new FormData(event.currentTarget));
        postInspector("/api/get", {path: raw.path, from: Number(raw.from), lines: Number(raw.lines)});
      };
      document.querySelector("#prompt-form").onsubmit = (event) => {
        event.preventDefault();
        const raw = Object.fromEntries(new FormData(event.currentTarget));
        postInspector("/api/prompt-preview", {
          tools: raw.tools.split(",").map((tool) => tool.trim()).filter(Boolean),
          citationsMode: raw.citationsMode
        });
      };
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.onclick = () => activateTab(tab.dataset.tab);
      });

      refresh().catch((error) => showOutput({error: error.message}));
    </script>
  </body>
</html>
