[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memory-core"
dynamic = ["version"]
description = "memory-core: a Python memory core for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
demo = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "memory-core[demo]",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "memory_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["memory_core"]

[tool.hatch.build.targets.sdist]
only-include = ["memory_core", "README.md", "CHANGELOG.md", "LICENSE.openclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
