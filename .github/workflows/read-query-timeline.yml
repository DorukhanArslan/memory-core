name: Read the original query timeline from the retained 16 MB review
on:
  push:
    branches: [verify/read-query-timeline-44927413199]
    paths: [.github/workflows/read-query-timeline.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 38c686d13ef7a9a88aa9e73ee226946d9bd252f0
          persist-credentials: false
      - name: Transport authenticated original query records for local review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, ".github/scripts")
          import restore_comparison_artifact as archive
          archive.RUN, archive.COMMIT = 44943504979, "59da2929000dc09b9bac9ff2be841442c098319f"
          seal = (14722198515, "retained-query-sync-warm-failure-44927413199", 16053283, "63abc38ffdefe86fd91bd512764a64504aff6a488e0382914e6cb625e5dae784")
          source = Path(os.environ["RUNNER_TEMP"])/"original.zip"
          archive.download(seal, source)
          with zipfile.ZipFile(source) as src:
              names = src.namelist()
              archive.require(len(names)==len(set(names)), "Duplicate query member")
              inventory = json.loads(src.read("physical-inventory.json"))
              expected = {r["member"].split("/query-sync-boundaries/",1)[1]:r for r in inventory["members"]}
              members = {n.removeprefix("original-files/"):n for n in names if n.startswith("original-files/") and not n.endswith("/")}
              missing = sorted(expected.keys()-members.keys())
              archive.require(not (members.keys()-expected.keys()), "Unexpected original physical members")
              for key, name in members.items():
                  raw = src.read(name)
                  archive.require(len(raw)==expected[key]["bytes"] and hashlib.sha256(raw).hexdigest()==expected[key]["sha256"], "Original physical evidence hash")
              print("PHYSICAL_INVENTORY",len(expected),len(members),"missing",json.dumps(missing),flush=True)
              for path in ("cases-00.json","runtimeDiagnostics-00.json","runtimeDiagnostics-01.json"):
                  b=src.read(path)
                  print("RECORD_SHA",path,len(b),hashlib.sha256(b).hexdigest())
              case=json.loads(src.read("cases-00.json"))
              result={"case":case,"differences":json.loads(src.read("public-differences.json")),
                      "physicalFiles":{"expected":len(expected),"present":len(members),"missing":missing}}
              for path in ("runtimeDiagnostics-00.json","runtimeDiagnostics-01.json"):
                  recording=json.loads(src.read(path))
                  raw=recording["rawSnapshots"][0]
                  if recording["side"]=="python":
                      raw=raw["observation"]["raw"]
                  keys=("events","schedule","faults","sqlGates","syncCalls","backgroundCalls","originalSearchCalls","publicationCalls","readAdmissions","functionalInterleavings","statusCalls","toolCalls","counterDerivations")
                  projection={}
                  for k in keys:
                      item=raw.get(k)
                      if isinstance(item,list):
                          projection[k]=[{name:vv for name,vv in row.items() if not isinstance(vv,(dict,list))} if isinstance(row,dict) else row for row in item]
                      elif isinstance(item,dict):
                          projection[k]={n:({name:vv for name,vv in row.items() if not isinstance(vv,(dict,list))} if isinstance(row,dict) else row) for n,row in item.items()}
                  result[recording["side"]]=projection
              import gzip
              def transport(key, obj):
                  raw=json.dumps(obj,ensure_ascii=True,separators=(",",":"),sort_keys=True).encode()
                  payload=base64.b64encode(gzip.compress(raw,mtime=0)).decode()
                  print("QRECORD",key,len(raw),hashlib.sha256(raw).hexdigest(),len(payload))
                  if len(payload)>100000:
                      raise ValueError("Corrected original diagnostic fragment exceeds transfer bound")
                  for j in range(0,len(payload),6000):
                      print("QDATA",key,j//6000,payload[j:j+6000])
              essential={key:result[key] for key in ("case","differences","physicalFiles")}
              for side in ("native","python"):
                  projection=result[side]
                  essential[side]={k:v for k,v in projection.items() if k!="events"}
              transport("public-and-gates",essential)
              transport("event-timelines",{side:result[side]["events"] for side in ("native","python")})
          PY
