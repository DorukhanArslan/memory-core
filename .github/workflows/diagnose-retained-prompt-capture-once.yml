name: Diagnose retained FIF capture metadata once

on:
  push:
    branches: [verify/prompt-runtime-context-diagnose-once]
    paths: [.github/workflows/diagnose-retained-prompt-capture-once.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Inspect only the sealed retained capture and emit metadata
        run: python .github/scripts/diagnose_retained_fif_capture.py "${{ runner.temp }}/fif-capture-size-receipt.json"
      - name: Retain the bounded metadata receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-fif-capture-size-diagnosis
          path: ${{ runner.temp }}/fif-capture-size-receipt.json
          if-no-files-found: warn
